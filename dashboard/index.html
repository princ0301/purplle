<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Intelligence - ST1008</title>
  <link rel="stylesheet" href="/dashboard/style/style.css" />
</head>
<body>

<header>
  <h1>Store Intelligence <span>ST1008</span> - Brigade Bangalore</h1>
  <div class="status-bar">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
    <span id="last-updated"></span>
  </div>
</header>

<div class="grid">
  <div class="card">
    <div class="card-label">Unique Visitors</div>
    <div class="card-value highlight" id="visitors">-</div>
    <div class="card-sub">Today</div>
  </div>
  <div class="card">
    <div class="card-label">Conversion Rate</div>
    <div class="card-value" id="conversion">-</div>
    <div class="card-sub">Visitors who purchased</div>
  </div>
  <div class="card">
    <div class="card-label">Queue Depth</div>
    <div class="card-value" id="queue">-</div>
    <div class="card-sub">Billing counter</div>
  </div>
  <div class="card">
    <div class="card-label">Abandonment Rate</div>
    <div class="card-value" id="abandonment">-</div>
    <div class="card-sub">Left billing queue</div>
  </div>
</div>

<div class="row">
  <div class="card">
    <h2>Conversion Funnel</h2>
    <div id="funnel-container"><span class="loading">Loading...</span></div>
  </div>
  <div class="card">
    <h2>Zone Heatmap</h2>
    <div id="heatmap-container"><span class="loading">Loading...</span></div>
  </div>
</div>

<div class="card">
  <h2>Active Anomalies</h2>
  <div id="anomalies-container"><span class="loading">Loading...</span></div>
</div>

<script src="/dashboard/script/script.js"></script>
</body>
</html>
