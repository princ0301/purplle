services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/store_intelligence.db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: info
      STORE_LAYOUT_PATH: ./data/store_layout.json
      POS_DATA_PATH: ./data/pos_transactions.csv
      STALE_FEED_THRESHOLD_MINUTES: 10
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
